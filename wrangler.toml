name = "asifa"
main = "worker.js"
compatibility_date = "2026-11-01"
workers_dev = false

# קבצי האתר (client/) והמיגרציות נכללים בוורקר כטקסט
[[rules]]
type = "Text"
globs = ["**/*.html", "**/*.css", "**/client-*.js", "**/*.sql"]
fallthrough = true

[[d1_databases]]
binding = "DB"
database_name = "asifa"
database_id = "22909c66-3a8f-4e47-9f82-7a94c0ede541"
migrations_dir = "migrations"

# משימות אוטומטיות (נעילה, צינתוק "לא קבעו", תזכורת): בחשבון החינמי אין מקום ל-Cron נוסף,
# לכן המתזמן (scheduler) קורא כל 5 דקות ל-POST /asifa/api/cron עם הכותרת X-Cron-Key = הסוד CRON_KEY.
# בנוסף המשימות רצות "על הדרך" בבקשות לאתר ולקו (לכל היותר פעם בשתי דקות).

[observability]
enabled = true
